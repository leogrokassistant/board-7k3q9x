<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0e14">
<title>期权模拟盘 · 实时盘面</title>
<style>
:root{--bg:#0b0e14;--card:#131824;--card2:#171d2b;--line:#252d3c;--fg:#e8ebf1;--mut:#8b94a7;--g:#2ecc71;--r:#ff5c5c;--y:#f5c451;--b:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
.sub{color:var(--mut);font-size:12px}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.g{background:var(--g);box-shadow:0 0 8px var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}
.warn{background:#2a2410;border:1px solid #4a3d12;color:#f1d58a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .k{color:var(--mut);font-size:12px}.card .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.card .s{color:var(--mut);font-size:12px;margin-top:2px}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{color:var(--b)}.m{color:var(--mut)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
section h2{font-size:15px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--card2)}
section h2 .m{font-weight:400;font-size:12px}
.tbl{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:180px}
.pill{display:inline-block;padding:0 7px;border-radius:99px;font-size:11px;border:1px solid var(--line);margin-left:4px}
.pill.call{color:var(--g);border-color:#1f5a38}.pill.put{color:var(--r);border-color:#6a2a2a}
.empty{color:var(--mut);text-align:center;padding:18px 10px}
.list>div{padding:9px 14px;border-bottom:1px solid var(--line)}.list>div:last-child{border-bottom:0}
.small{font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
/* 手机：持仓表改卡片 */
@media (max-width:640px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .card .v{font-size:19px}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{padding:8px 12px;border-bottom:1px solid var(--line)}
  table.resp td{border:0;padding:2px 0;white-space:normal;display:flex;justify-content:space-between;gap:10px}
  table.resp td::before{content:attr(data-l);color:var(--mut);font-size:12px}
  table.resp td.head{font-size:15px;font-weight:700;display:block}
  table.resp td.head::before{content:none}
}
footer{color:var(--mut);font-size:11.5px;text-align:center;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>📈 期权模拟盘 · 实时盘面</h1><div class="sub" id="sub">加载中…</div></div>
  <div class="badges" id="badges"></div>
</header>
<div class="warn" id="warn"></div>
<div class="cards" id="cards"></div>
<section><h2>当前持仓 <span class="m" id="nopen"></span></h2><div class="tbl" id="open"></div></section>
<section><h2>已平仓交易 <span class="m" id="nclosed"></span></h2><div class="tbl" id="closed"></div></section>
<div class="two">
  <section><h2>🐳 大单雷达 A 级信号 <span class="m">最近 8 条</span></h2><div class="list" id="radar"></div></section>
  <section><h2>重要事件 <span class="m">最新在上</span></h2><div class="list" id="logs"></div></section>
</div>
<footer>数据每 30 秒推送一次，本页每 20 秒自动刷新 · 时间为北京时间（括号内为美东 ET）<br>模拟盘，仅供观察，不构成投资建议</footer>
</div>
<script>
const SRC="https://textdb.dev/api/data/1FAA7C57E763972438D8601C14E5D64BFDB643A99C85E78D63CDFE8242D7537C";
const POLL=20000, STALE=150;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,d=2)=>x==null||isNaN(x)?'—':Number(x).toFixed(d);
const pct=x=>x==null?'—':(x>0?'+':'')+num(x,1)+'%';
const usd=x=>x==null?'—':(x<0?'-$':(x>0?'+$':'$'))+Math.abs(Number(x)).toLocaleString('en-US',{maximumFractionDigits:0});
const cls=x=>x==null?'':(x>0?'g':(x<0?'r':''));
const tt=t=>t&&t.bj?`${esc(t.bj.length>5?t.bj.slice(6):t.bj)} <span class="m">(${esc(t.et)})</span>`:'—';
const side=r=>r==='CALL'?'<span class="pill call">CALL</span>':(r==='PUT'?'<span class="pill put">PUT</span>':'');
let D=null, lastOk=0;

function etNow(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;return {wd:g('weekday'),m:(+g('hour')%24)*60+(+g('minute'))};}
function marketNow(){const e=etNow();if(e.wd==='Sat'||e.wd==='Sun')return '周末休市';
  if(e.m>=570&&e.m<960)return '盘中';if(e.m>=240&&e.m<570)return '盘前';if(e.m>=960&&e.m<1200)return '盘后';return '休市';}
function ago(sec){if(sec<60)return Math.round(sec)+' 秒前';if(sec<3600)return Math.round(sec/60)+' 分钟前';if(sec<86400)return (sec/3600).toFixed(1)+' 小时前';return Math.round(sec/86400)+' 天前';}
function card(k,v,c='',s=''){return `<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`}

function header(){
  const mk=marketNow(), open=mk==='盘中';
  let h=`<span class="badge"><span class="dot ${open?'g':'y'}"></span>美股${mk}</span>`;
  if(D){
    const age=(Date.now()-Date.parse(D.updated_at))/1000;
    h+=`<span class="badge"><span class="dot ${D.running?'g':''}"></span>${D.running?'系统运行中':'系统未运行'}</span>`;
    h+=`<span class="badge"><span class="dot ${age>STALE?'r':'g'}"></span>更新于 ${ago(age)}</span>`;
    $('sub').innerHTML=`交易日 ${esc(D.session||'—')}（美东）· 数据时间 ${esc(D.updated_bj.slice(5))} 北京 / ${esc(D.updated_et.slice(11,16))} ET`;
    const w=[];
    if(age>STALE&&D.running) w.push(`⚠️ 数据已 ${ago(age)} 没有更新，推送可能中断，页面上的数字可能不是最新的。`);
    else if(age>STALE&&open) w.push(`ℹ️ 当前是盘中，但系统未在运行或尚未开始推送（最后数据 ${ago(age)}）。`);
    if(!open&&!D.running) w.push(`🌙 当前非交易时段，下面显示的是最近一个交易日（${esc(D.session)}）的结果。每个交易日北京时间 21:15 左右（冬令时 22:15）自动开盘推送。`);
    $('warn').innerHTML=w.join('<br>');$('warn').style.display=w.length?'block':'none';
  }
  if(!lastOk&&!D)$('sub').textContent='加载中…';
  $('badges').innerHTML=h;
}

function render(){
  const d=D,t=d.totals||{};
  const total=(t.realized||0)+(t.unrealized||0);
  let c=card('今日总盈亏',usd(total),cls(total),t.unrealized==null?'已实现':'含持仓浮动')+
    card('已实现盈亏',usd(t.realized),cls(t.realized),`${t.n||0} 笔已平`)+
    card('持仓浮盈亏',t.unrealized==null?'—':usd(t.unrealized),cls(t.unrealized),`${t.open||0} 个持仓`)+
    card('胜率',t.win_rate==null?'—':num(t.win_rate,1)+'%','',`${t.wins||0} 胜 / ${(t.n||0)-(t.wins||0)} 负`)+
    card('盈亏比',t.pl_ratio==null?'—':num(t.pl_ratio,2),t.pl_ratio==null?'':(t.pl_ratio>=1?'g':'y'),`均盈 ${usd(t.avg_win)} / 均亏 ${usd(t.avg_loss)}`)+
    card('利润因子',t.profit_factor==null?'—':num(t.profit_factor,2),t.profit_factor==null?'':(t.profit_factor>=1?'g':'r'),'总盈利 ÷ 总亏损');
  for(const [k,v] of Object.entries(t.by_source||{})) c+=card(esc(k),usd(v.pnl),cls(v.pnl),`${v.n} 笔 · 胜 ${v.wins}`);
  if(d.gex&&d.gex.regimes&&Object.keys(d.gex.regimes).length){
    const rg=Object.entries(d.gex.regimes).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${esc(k)} ${v}`).join(' · ');
    c+=card('热力图结构',`${d.gex.opened??0}/${d.gex.confirmed??0}`,'',`开仓/确认 · ${rg}`);
  }
  $('cards').innerHTML=c;

  const op=d.open||[];
  $('nopen').textContent=op.length?`${op.length} 个`:'';
  $('open').innerHTML=op.length?`<table class="resp"><thead><tr><th>标的</th><th>合约</th><th>张数</th><th>入场</th><th>现价</th><th>收益率</th><th>浮盈亏</th><th>峰值</th><th>锁利档位</th><th>现货止损</th><th>持有</th><th>来源</th></tr></thead><tbody>${
    op.map(p=>`<tr><td class="head">${esc(p.ticker)}${side(p.right)}</td>
      <td data-l="合约" class="m">${esc(p.contract)}</td><td data-l="张数">${p.qty}</td>
      <td data-l="入场">${num(p.entry)} <span class="m small">${tt(p.entry_t)}</span></td>
      <td data-l="现价">${p.mid==null?'<span class="m">待更新</span>':num(p.mid)}</td>
      <td data-l="收益率" class="${cls(p.roi)}"><b>${pct(p.roi)}</b></td>
      <td data-l="浮盈亏" class="${cls(p.pnl)}"><b>${usd(p.pnl)}</b>${p.partial_pnl?` <span class="m small">另落袋 ${usd(p.partial_pnl)}</span>`:''}</td>
      <td data-l="峰值" class="${cls(p.peak)}">${pct(p.peak)}</td><td data-l="锁利档位">${esc(p.tier)}</td>
      <td data-l="现货止损">${num(p.spot_stop)}${p.target?` <span class="m small">→ ${num(p.target)}</span>`:''}</td>
      <td data-l="持有">${p.held==null?'—':p.held+' 分'}</td><td data-l="来源">${esc(p.source)} <span class="m small">${esc(p.arch||'')}</span></td></tr>`).join('')
  }</tbody></table>`:'<div class="empty">当前没有持仓</div>';

  const cl=d.closed||[];
  $('nclosed').textContent=cl.length?`${cl.length} 笔`:'';
  $('closed').innerHTML=cl.length?`<table class="resp"><thead><tr><th>标的</th><th>合约</th><th>张数</th><th>入场</th><th>平仓</th><th>持有</th><th>收益率</th><th>盈亏</th><th>峰值</th><th>平仓原因</th><th>来源</th></tr></thead><tbody>${
    cl.map(c=>`<tr><td class="head">${esc(c.ticker)}${side(c.right)}</td>
      <td data-l="合约" class="m">${esc(c.contract)}</td><td data-l="张数">${c.qty??'—'}</td>
      <td data-l="入场">${num(c.entry)} <span class="m small">${tt(c.entry_t)}</span></td>
      <td data-l="平仓">${tt(c.exit_t)}</td><td data-l="持有">${c.held==null?'—':c.held+' 分'}</td>
      <td data-l="收益率" class="${cls(c.roi)}"><b>${pct(c.roi)}</b></td><td data-l="盈亏" class="${cls(c.pnl)}"><b>${usd(c.pnl)}</b></td>
      <td data-l="峰值" class="${cls(c.peak)}">${pct(c.peak)}</td>
      <td data-l="平仓原因" class="wrap small">${esc((c.reason||'').split('｜').pop())}</td>
      <td data-l="来源">${esc(c.source)} <span class="m small">${esc(c.arch||'')}</span></td></tr>`).join('')
  }</tbody></table>`:'<div class="empty">今天还没有平仓</div>';

  const ra=d.radar||[];
  $('radar').innerHTML=ra.length?ra.map(r=>`<div><b>${esc(r.ticker)}</b> <span class="${r.dir==='看涨'?'g':'r'}">${esc(r.dir)}</span>
     <span class="m small">${tt(r.t)}</span><br><span class="small">${esc(r.contract)}</span><br><span class="m small">${esc(r.detail)}</span></div>`).join('')
    :'<div class="empty">暂无 A 级大单（门槛很严，一天 0 到几条）</div>';
  const lg=d.logs||[];
  $('logs').innerHTML=lg.length?lg.map(l=>`<div class="small ${l.lvl==='ERROR'?'r':(l.lvl==='WARNING'?'y':'')}"><span class="m">${tt(l.t)}</span> ${esc(l.msg)}</div>`).join('')
    :'<div class="empty">暂无</div>';
}

async function tick(){
  try{
    const r=await fetch(SRC,{cache:'no-store',headers:{accept:'text/plain'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();const j=JSON.parse(txt);
    if(!j||!j.updated_at)throw new Error('暂无数据');
    D=j;lastOk=Date.now();render();
  }catch(e){
    if(!D){$('sub').textContent='数据加载失败，重试中…（'+e.message+'）';}
  }
  header();
}
tick();setInterval(tick,POLL);setInterval(header,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script>
</body>
</html>
